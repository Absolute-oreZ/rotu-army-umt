name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check environment
        run: npm run env:check -- --production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_STORAGE_ROOT_PATH: ${{ vars.NEXT_PUBLIC_SUPABASE_STORAGE_ROOT_PATH }}
          NEXT_PUBLIC_SUPABASE_PRIVATE_STORAGE_ROOT_PATH: ${{ vars.NEXT_PUBLIC_SUPABASE_PRIVATE_STORAGE_ROOT_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_RESEND_FROM_EMAIL: ${{ vars.NEXT_PUBLIC_RESEND_FROM_EMAIL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_SPORTS_UKA_RUN_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_RUN_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_RUN_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_RUN_FEMALE }}
          NEXT_PUBLIC_SPORTS_UKA_PUSHUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_PUSHUP_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_PUSHUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_PUSHUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_UKA_SITUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_SITUP_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_SITUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_SITUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_RUN_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_RUN_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_RUN_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_RUN_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_PULLUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_PULLUP_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_PULLUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_PULLUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_SWIMMING_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_SWIMMING_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_SWIMMING_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_SWIMMING_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_FLOATING_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_FLOATING_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_FLOATING_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_FLOATING_FEMALE }}
          NEXT_PUBLIC_WELFARE_ATTEND_SOURCES: ${{ vars.NEXT_PUBLIC_WELFARE_ATTEND_SOURCES }}
          NEXT_PUBLIC_WELFARE_REGLIGIOUS_ACTIVITIES_TYPES: ${{ vars.NEXT_PUBLIC_WELFARE_REGLIGIOUS_ACTIVITIES_TYPES }}

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_STORAGE_ROOT_PATH: ${{ vars.NEXT_PUBLIC_SUPABASE_STORAGE_ROOT_PATH }}
          NEXT_PUBLIC_SUPABASE_PRIVATE_STORAGE_ROOT_PATH: ${{ vars.NEXT_PUBLIC_SUPABASE_PRIVATE_STORAGE_ROOT_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_RESEND_FROM_EMAIL: ${{ vars.NEXT_PUBLIC_RESEND_FROM_EMAIL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEWSLETTER_UNSUBSCRIBE_SECRET: ${{ secrets.NEWSLETTER_UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_SPORTS_UKA_RUN_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_RUN_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_RUN_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_RUN_FEMALE }}
          NEXT_PUBLIC_SPORTS_UKA_PUSHUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_PUSHUP_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_PUSHUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_PUSHUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_UKA_SITUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_SITUP_MALE }}
          NEXT_PUBLIC_SPORTS_UKA_SITUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_UKA_SITUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_RUN_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_RUN_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_RUN_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_RUN_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_PULLUP_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_PULLUP_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_PULLUP_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_PULLUP_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_SWIMMING_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_SWIMMING_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_SWIMMING_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_SWIMMING_FEMALE }}
          NEXT_PUBLIC_SPORTS_APFA_FLOATING_MALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_FLOATING_MALE }}
          NEXT_PUBLIC_SPORTS_APFA_FLOATING_FEMALE: ${{ vars.NEXT_PUBLIC_SPORTS_APFA_FLOATING_FEMALE }}
          NEXT_PUBLIC_WELFARE_ATTEND_SOURCES: ${{ vars.NEXT_PUBLIC_WELFARE_ATTEND_SOURCES }}
          NEXT_PUBLIC_WELFARE_REGLIGIOUS_ACTIVITIES_TYPES: ${{ vars.NEXT_PUBLIC_WELFARE_REGLIGIOUS_ACTIVITIES_TYPES }}